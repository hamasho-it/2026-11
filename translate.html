<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oh,結び - 翻訳画面</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <a href="./home.html" class="btn-back">戻る</a>
      <h1>翻訳</h1>
    </header>
    <main>
      <!-- 2枠言語選択UI -->
      <div class="lang-dual-box" style="margin-bottom:12px;">
        <a href="./language.html" class="lang-select-frame" style="text-decoration:none;">
          <div class="label">翻訳元（入力）</div>
          <div class="value" id="display-from-lang">日本語</div>
        </a>
        <button type="button" class="lang-swap-btn" id="swap-lang-btn" title="言語を入れ替え">⇄</button>
        <a href="./language.html" class="lang-select-frame" style="text-decoration:none;">
          <div class="label">翻訳先（出力）</div>
          <div class="value" id="display-to-lang">英語</div>
        </a>
      </div>

      <!-- 文字入力翻訳エリア -->
      <div class="text-translate-box">
        <label for="translate-text-input">✍️ テキストを入力して翻訳</label>
        <textarea id="translate-text-input" placeholder="ここに翻訳したい文章や単語を入力してください..."></textarea>
        <button type="button" id="do-translate-btn" class="btn btn-primary" style="margin-bottom:0; padding:10px;">翻訳する</button>
      </div>

      <!-- リアルタイム翻訳結果表示領域 -->
      <div class="translate-output" id="translate-output-text">
        <div style="font-weight:bold; color:#666; font-size:12px; margin-bottom:4px;">翻訳結果の出力エリア</div>
        <p style="color:#888; font-size:13px;">上にテキストを入力するか「翻訳する」を押すと結果が表示されます。</p>
      </div>

      <div style="margin-top:12px;" class="translate-tools">
        <button type="button" id="camera-btn" class="btn translate-btn">
          <img src="./images/camera_icon.png" alt="カメラ" style="width:24px; height:24px;" onerror="this.style.display='none';">
          <span>カメラ</span>
        </button>
        <a href="./cameraroll.html" class="btn translate-btn">
          <img src="./images/photo_icon.png" alt="写真" style="width:24px; height:24px;" onerror="this.style.display='none';">
          <span>写真</span>
        </a>
        <a href="./translate_result.html" class="btn translate-btn full-btn">
          <img src="./images/mic_icon.png" alt="音声" style="width:24px; height:24px;" onerror="this.style.display='none';">
          <span>音声翻訳へ</span>
        </a>
      </div>

      <div style="margin-top:10px;">
        <a href="./home.html" class="btn">戻る</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./home.html" class="nav-item">
        <div class="nav-icon">🏠</div>
        <span>ホーム</span>
      </a>
      <a href="./map.html" class="nav-item">
        <div class="nav-icon">📍</div>
        <span>マップ</span>
      </a>
      <a href="./translate.html" class="nav-item active">
        <div class="nav-icon">🌐</div>
        <span>翻訳</span>
      </a>
      <a href="./board.html" class="nav-item">
        <div class="nav-icon">📋</div>
        <span>掲示板</span>
      </a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
