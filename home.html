<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oh,結び - ホーム画面</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>ホーム画面</h1>
    </header>
    <main>
      <div class="status-grid">
        <a href="./rank.html" class="card card-link">
          <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:4px;">
            <img src="./images/crown_icon.png" alt="王冠" style="width:20px; height:20px;" onerror="this.style.display='none';">
            <span style="font-size:12px; color:#666;">ランク</span>
          </div>
          <div style="font-size:24px; font-weight:bold;">Lv.3</div>
          <div style="font-size:11px; color:#888; margin-top:4px;">ポイントに応じてランクが上がる</div>
        </a>
        
        <a href="./point_rewards.html" class="card card-link">
          <div style="font-size:12px; color:#666; margin-bottom:4px;">獲得ポイント</div>
          <div style="font-size:28px; font-weight:bold;" class="user-point-val">12</div>
          <div style="font-size:12px; color:#666;">ポイント ➔</div>
          <div style="font-size:11px; color:#888; margin-top:4px;">タップで特典一覧を表示</div>
        </a>
      </div>

      <div class="ad-banner">
        <div class="ad-content">
          <span class="ad-badge">PR 広告</span>
          <h4>地酒と名物おむすびフェア開催！</h4>
          <p>近隣の協賛店舗でポイント2倍キャンペーン中</p>
        </div>
        <a href="./point_rewards.html" class="ad-btn">詳細</a>
      </div>

      <a href="./profile_edit.html" class="card card-link profile-card">
        <div class="img-box" style="width:60px; height:60px; border-radius:50%;">
          <img src="./images/profile_icon.png" alt="アイコン" class="avatar-preview" onerror="this.style.display='none'; this.parentElement.innerText='アイコン';">
        </div>
        <div style="flex:1;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:16px; font-weight:bold;">プロフィール</span>
            <span style="font-size:12px; color:#888;">編集 ➔</span>
          </div>
          <div style="font-size:13px; color:#666; margin-top:4px;">ユーザー：<span id="display-user-name">利用者A</span></div>
          <div style="font-size:11px; color:#888; margin-top:2px;">タップしてアイコン・名前・通知設定を変更</div>
        </div>
      </a>

      <div style="margin-top: 10px;">
        <!-- 設定ボタンを押した時にプロフィール・通知設定編集画面（profile_edit.html）に遷移するように対応 -->
        <a href="./profile_edit.html" class="btn">設定</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./home.html" class="nav-item active">
        <div class="nav-icon">🏠</div>
        <span>ホーム</span>
      </a>
      <a href="./map.html" class="nav-item">
        <div class="nav-icon">📍</div>
        <span>マップ</span>
      </a>
      <a href="./translate.html" class="nav-item">
        <div class="nav-icon">🌐</div>
        <span>翻訳</span>
      </a>
      <a href="./board.html" class="nav-item">
        <div class="nav-icon">📋</div>
        <span>掲示板</span>
      </a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
