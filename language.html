<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oh,結び - 言語選択画面</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <a href="./translate.html" class="btn-back">戻る</a>
      <h1>言語を選択</h1>
    </header>
    <main>
      <div class="card" style="text-align:left; margin-bottom:14px;">
        <h3 style="font-size:14px; font-weight:bold; margin-bottom:8px; color:#555;">【枠1】翻訳元の言語</h3>
        <div class="lang-grid">
          <div class="btn lang-item-from selected" data-lang="日本語" style="padding:10px;">日本語</div>
          <div class="btn lang-item-from" data-lang="英語" style="padding:10px;">英語</div>
          <div class="btn lang-item-from" data-lang="韓国語" style="padding:10px;">韓国語</div>
          <div class="btn lang-item-from" data-lang="中国語" style="padding:10px;">中国語</div>
        </div>
      </div>

      <div class="card" style="text-align:left; margin-bottom:16px;">
        <h3 style="font-size:14px; font-weight:bold; margin-bottom:8px; color:#555;">【枠2】翻訳先の言語</h3>
        <div class="lang-grid">
          <div class="btn lang-item-to" data-lang="日本語" style="padding:10px;">日本語</div>
          <div class="btn lang-item-to selected" data-lang="英語" style="padding:10px;">英語</div>
          <div class="btn lang-item-to" data-lang="韓国語" style="padding:10px;">韓国語</div>
          <div class="btn lang-item-to" data-lang="中国語" style="padding:10px;">中国語</div>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <a href="./translate.html" class="btn btn-primary">決定して戻る</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./home.html" class="nav-item">
        <div class="nav-icon">🏠</div>
        <span>ホーム</span>
      </a>
      <a href="./map.html" class="nav-item">
        <div class="nav-icon">📍</div>
        <span>マップ</span>
      </a>
      <a href="./translate.html" class="nav-item active">
        <div class="nav-icon">🌐</div>
        <span>翻訳</span>
      </a>
      <a href="./board.html" class="nav-item">
        <div class="nav-icon">📋</div>
        <span>掲示板</span>
      </a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
