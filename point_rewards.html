<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oh,結び - ポイント特典・クーポン一覧</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <a href="./home.html" class="btn-back">戻る</a>
      <h1>ポイント特典・クーポン</h1>
    </header>
    <main>
      <div class="card" style="background:#f8f8f8; text-align:center;">
        <div style="font-size:13px; color:#666;">現在の所持ポイント</div>
        <div style="font-size:32px; font-weight:bold; color:#000;" class="user-point-val">12</div>
        <div style="font-size:12px; color:#888;">地元の掲示板に情報投稿してポイントゲット！</div>
      </div>

      <!-- 自分の持っている特典・保有クーポン表示エリア -->
      <div style="margin-top:12px;">
        <div style="font-weight:bold; font-size:15px; margin-bottom:8px; display:flex; align-items:center; gap:6px;">
          <span>🎟️ My特典・保有クーポン（所持中）</span>
        </div>
        <div id="my-rewards-container">
          <!-- JSで保有しているクーポン・特典がここに動的表示されます -->
        </div>
      </div>

      <div class="ad-banner" style="margin-top:10px;">
        <div class="ad-content">
          <span class="ad-badge">スポンサー</span>
          <h4>吉村食堂 スパイスカレー新発売</h4>
          <p>今なら5ptでトッピング無料券と交換！</p>
        </div>
        <button type="button" class="ad-btn btn-exchange" data-cost="5" data-title="カレー無料トッピング券">交換</button>
      </div>

      <div style="font-weight:bold; font-size:15px; margin-top:10px;">🎁 ポイントで交換できる特典</div>

      <div class="reward-card">
        <div class="reward-info">
          <h4>吉村食堂 名物おむすび1個無料券</h4>
          <p>店頭提示で使える（吉村食堂限定）</p>
          <div style="font-weight:bold; font-size:13px; color:#333; margin-top:4px;">必要：10pt</div>
        </div>
        <button type="button" class="btn btn-primary reward-btn btn-exchange" data-cost="10" data-title="吉村食堂 名物おむすび1個無料券">交換する</button>
      </div>

      <div class="reward-card">
        <div class="reward-info">
          <h4>サンプル商店 100円引きクーポン</h4>
          <p>お会計時に使える共通割引券</p>
          <div style="font-weight:bold; font-size:13px; color:#333; margin-top:4px;">必要：5pt</div>
        </div>
        <button type="button" class="btn btn-primary reward-btn btn-exchange" data-cost="5" data-title="サンプル商店 100円引きクーポン">交換する</button>
      </div>

      <div class="reward-card">
        <div class="reward-info">
          <h4>地域オリジナルステッカー</h4>
          <p>観光案内所にてお渡し</p>
          <div style="font-weight:bold; font-size:13px; color:#333; margin-top:4px;">必要：15pt</div>
        </div>
        <button type="button" class="btn reward-btn btn-exchange" data-cost="15" data-title="地域オリジナルステッカー">交換する</button>
      </div>

      <div style="margin-top: 10px;">
        <a href="./home.html" class="btn">ホームへ戻る</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./home.html" class="nav-item active">
        <div class="nav-icon">🏠</div>
        <span>ホーム</span>
      </a>
      <a href="./map.html" class="nav-item">
        <div class="nav-icon">📍</div>
        <span>マップ</span>
      </a>
      <a href="./translate.html" class="nav-item">
        <div class="nav-icon">🌐</div>
        <span>翻訳</span>
      </a>
      <a href="./board.html" class="nav-item">
        <div class="nav-icon">📋</div>
        <span>掲示板</span>
      </a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
