<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oh,結び - プロフィール・通知設定編集</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <a href="./home.html" class="btn-back">戻る</a>
      <h1>プロフィール・通知設定</h1>
    </header>
    <main>
      <div class="card avatar-edit-container">
        <img src="./images/profile_icon.png" alt="アバタープレビュー" class="avatar-preview">
        <input type="file" id="avatar-file-input" accept="image/*" style="display:none;">
        <button type="button" id="change-avatar-btn" class="btn" style="width:auto; padding:8px 16px; font-size:13px; margin-bottom:0;">アイコン画像を変更</button>
      </div>

      <div class="card" style="text-align:left;">
        <label style="font-size:14px; font-weight:bold; display:block; margin-bottom:6px;">ユーザー名</label>
        <input type="text" id="user-name-input" placeholder="名前を入力（例：利用者A）">
      </div>

      <div class="card" style="text-align:left;">
        <h3 style="font-size:15px; font-weight:bold; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:6px;">通知設定</h3>
        
        <div class="setting-item">
          <div>
            <div style="font-size:14px; font-weight:bold;">プッシュ通知</div>
            <div style="font-size:12px; color:#666;">全体のお知らせを受け取る</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="notif-push" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <div>
            <div style="font-size:14px; font-weight:bold;">リアルタイム掲示板通知</div>
            <div style="font-size:12px; color:#666;">近隣（20m以内）の新着投稿を通知</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="notif-board" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <div>
            <div style="font-size:14px; font-weight:bold;">おすすめ・イベント通知</div>
            <div style="font-size:12px; color:#666;">地元のおすすめスポット情報を通知</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="notif-event">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <button type="button" id="save-profile-btn" class="btn btn-primary">設定を保存する</button>
        <a href="./home.html" class="btn">戻る</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./home.html" class="nav-item active">
        <div class="nav-icon">🏠</div>
        <span>ホーム</span>
      </a>
      <a href="./map.html" class="nav-item">
        <div class="nav-icon">📍</div>
        <span>マップ</span>
      </a>
      <a href="./translate.html" class="nav-item">
        <div class="nav-icon">🌐</div>
        <span>翻訳</span>
      </a>
      <a href="./board.html" class="nav-item">
        <div class="nav-icon">📋</div>
        <span>掲示板</span>
      </a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
